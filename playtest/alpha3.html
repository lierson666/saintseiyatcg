<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Saint Seiya TCG — Alpha 0.1</title>
  <link rel="icon" href="../LOGO/favicon.png">
  <style>
    :root { --bg: #0b0c17; --panel: #151729; --line: #2c2f4d; --text: #e9e7f5; --muted: #9a98b8; --gold: #e6c36a; --blue: #65bbef; --red: #ef7a7a; --green: #79d0a4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    header.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    header.bar h1 { font-size: 16px; margin: 0; color: var(--gold); }
    header.bar a { color: var(--muted); }
    main { padding: 12px 16px 40px; display: grid; gap: 12px; }
    .status { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .status strong { color: var(--gold); }
    .player { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 12px; }
    .player.active { border-color: var(--gold); }
    .player h2 { margin: 0 0 6px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .player h2 span { font-weight: 400; color: var(--muted); }
    .zone { margin-top: 8px; }
    .zone > b { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .card { width: 168px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #1c1f36; display: grid; gap: 4px; }
    .card.unprepared { opacity: .72; border-style: dashed; }
    .card.pick { outline: 2px solid var(--blue); }
    .card .name { font-weight: 600; }
    .card .meta { color: var(--muted); font-size: 12px; }
    .card .gear { color: var(--green); font-size: 12px; }
    .card details { font-size: 12px; color: var(--muted); }
    .card details p { white-space: pre-wrap; margin: 4px 0 0; }
    button { font: inherit; color: var(--text); background: #262a4a; border: 1px solid #3a3f6a; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    button:hover { background: #30355c; }
    button.primary { background: #4a3d16; border-color: var(--gold); }
    button:disabled { opacity: .45; cursor: default; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #notice { position: fixed; left: 16px; right: 16px; bottom: 12px; padding: 8px 12px; border-radius: 8px; background: #3a1d24; border: 1px solid var(--red); display: none; }
    #notice.show { display: block; }
    .log { max-height: 220px; overflow: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    label { color: var(--muted); }
    input[type=number] { width: 80px; }
  </style>
</head>
<body>
  <header class="bar"><h1>Alpha 0.1 · Engine 3.0</h1><span>Pegasus Rush × Dragon Fortress (D171) · local, two players</span><a href="./">Back to the main playtest</a></header>
  <main id="root"><p>Loading…</p></main>
  <div id="notice" role="status" aria-live="polite"></div>
  <script type="module" src="./app-v3.js?v=20261028-1"></script>
</body>
</html>
