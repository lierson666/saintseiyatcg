<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saint Seiya TCG</title>
    <meta name="description" content="Saint Seiya TCG — duel as the Gods with Saints, Cloths and Cosmo. Play the Athena beta in your browser.">
    <link rel="icon" type="image/png" href="../LOGO/favicon.png">
    <!-- Web app (instalar na tela inicial) -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#05070c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Saint Seiya TCG">
    <link rel="apple-touch-icon" href="../LOGO/apple-touch-icon.png">
    <!-- Prévia ao compartilhar (WhatsApp, Telegram, redes): URLs absolutas -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Saint Seiya TCG">
    <meta property="og:title" content="Saint Seiya TCG">
    <meta property="og:description" content="Duel as the Gods with Saints, Cloths and Cosmo. Play the Athena beta in your browser.">
    <meta property="og:url" content="https://saintseiyatcg.com/playtest/">
    <meta property="og:image" content="https://saintseiyatcg.com/LOGO/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Saint Seiya TCG logo over a space nebula">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://saintseiyatcg.com/LOGO/og-image.jpg">
    <link rel="stylesheet" href="./styles.css?v=11">
    <link rel="stylesheet" href="./arena.css?v=11">
  </head>
  <body>
    <div class="viewport">
      <div class="playtest-shell">
        <section class="arena-stage panel">
          <button id="toggle-options" class="options-toggle" aria-expanded="false" aria-controls="options-menu" aria-label="Open options menu">
            <span class="options-toggle__icon">⚙</span>
          </button>

          <section id="options-menu" class="options-menu hidden panel" aria-hidden="true">
            <div class="options-menu__header">
              <img class="brand-logo brand-logo--menu" src="../LOGO/logo-web.webp" alt="Saint Seiya TCG">
              <h1>Athena Beta v0.1</h1>
              <p class="topbar-subtitle">Arena-style digital playtest board for Athena mirror testing.</p>
            </div>

            <div class="toolbar panel">
              <label class="field">
                <span>Player A</span>
                <select id="deck-a"></select>
              </label>
              <label class="field">
                <span>Player B</span>
                <select id="deck-b"></select>
              </label>
              <div class="toolbar-actions">
                <button id="start-match" class="primary">Start Match</button>
                <button id="swap-decks">Swap</button>
                <button id="next-turn">Next Turn</button>
                <button id="reset-match">Reset</button>
              </div>
              <label class="toggle-field">
                <input id="ai-player-b" type="checkbox" checked>
                <span>AI controls Player B</span>
              </label>
            </div>

            <section class="options-menu__section settings-panel" aria-label="Gameplay settings">
              <p class="eyebrow">Gameplay</p>
              <label class="toggle-field">
                <input id="setting-full-control" type="checkbox">
                <span>Full Control <small>always choose how to pay and stop at every response</small></span>
              </label>
              <label class="toggle-field">
                <input id="setting-auto-pass" type="checkbox" checked>
                <span>Auto-pass <small>skip Upkeep/Draw and responses with nothing to play</small></span>
              </label>
              <label class="field">
                <span>AI speed</span>
                <select id="setting-ai-speed">
                  <option value="slow">Slow</option>
                  <option value="normal">Normal</option>
                  <option value="fast">Fast</option>
                </select>
              </label>
              <p class="settings-panel__keys">Space: main button • Enter: confirm attack • Esc: cancel • Z: undo • Shift + play: choose payment • Double-click: play card</p>
            </section>

            <section class="options-menu__section">
              <div class="dock-tabs">
                <button class="dock-tab is-active" data-action="dock-tab" data-tab="log" data-dock-tab="log">Log</button>
                <button class="dock-tab" data-action="dock-tab" data-tab="help" data-dock-tab="help">Help</button>
                <button class="dock-tab" data-action="dock-tab" data-tab="coverage" data-dock-tab="coverage">Coverage</button>
              </div>
              <div id="dock-tab-content" class="dock-tab-content"></div>
            </section>
          </section>

          <p id="turn-indicator" class="turn-indicator arena-turn-indicator">Load a match to begin.</p>

          <svg id="combat-overlay" class="combat-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>

          <div id="turn-banner" class="turn-banner hidden" aria-live="polite"></div>
          <div id="respond-prompt" class="respond-prompt hidden" role="alertdialog" aria-label="Respond to attack"></div>
          <aside id="stack-panel" class="stack-panel hidden" aria-label="Stack"></aside>

          <main id="playmat" class="playmat">
            <section id="player-a-board" class="board-slot board-slot--top"></section>
            <section id="center-hud-slot" class="board-slot board-slot--center">
              <section id="action-bar" class="center-hud-bar"></section>
            </section>
            <section id="player-b-board" class="board-slot board-slot--bottom"></section>
          </main>

          <aside class="hero-column">
            <section id="player-a-domain-slot" class="hero-slot"></section>
            <section id="player-a-god-slot" class="hero-slot"></section>
            <section id="player-b-god-slot" class="hero-slot"></section>
            <section id="player-b-domain-slot" class="hero-slot"></section>
          </aside>

        </section>
      </div>
    </div>

    <div id="hover-preview" class="floating-card-preview hidden" aria-hidden="true"></div>
    <div id="floating-info" class="floating-info hidden" aria-hidden="true"></div>
    <div id="log-popup" class="log-popup hidden" aria-hidden="true"></div>
    <div id="victory-overlay" class="victory-overlay hidden" aria-hidden="true"></div>
    <div id="context-menu" class="context-menu hidden" aria-hidden="true"></div>
    <div id="new-game-overlay" class="new-game-overlay hidden" aria-hidden="true"></div>
    <div id="mulligan-overlay" class="mulligan-overlay hidden" aria-hidden="true"></div>
    <div id="payment-overlay" class="payment-overlay hidden" aria-hidden="true"></div>
    <div id="spell-overlay" class="spell-overlay hidden" aria-hidden="true"></div>
    <div id="equip-overlay" class="equip-overlay hidden" aria-hidden="true"></div>
    <div id="zone-browser-overlay" class="zone-browser-overlay hidden" aria-hidden="true"></div>
    <div id="combat-toast" class="combat-toast hidden" aria-hidden="true"></div>
    <div id="zone-selection-overlay" class="zone-selection-overlay hidden" aria-hidden="true"></div>

    <script type="module" src="./app.js?v=11"></script>
  </body>
</html>
