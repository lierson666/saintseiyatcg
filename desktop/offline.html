<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
  <title>Saint Seiya TCG — Offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070c; color: #e9e3d3; font: 16px/1.5 Georgia, 'Times New Roman', serif; }
    body { display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 1.6rem; letter-spacing: .12em; text-transform: uppercase; color: #e8c877; margin: 0 0 .5rem; font-weight: 400; }
    p { margin: 0 0 1.5rem; color: #b9b2a3; }
    button { font: inherit; letter-spacing: .14em; text-transform: uppercase; padding: .8rem 2.2rem; border-radius: 999px; border: 0; cursor: pointer;
      background: linear-gradient(#f3dc99, #c99a45); color: #1a1408; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>The Sanctuary is out of reach</h1>
    <p>Saint Seiya TCG needs an internet connection. Check your connection and try again.</p>
    <button id="retry" autofocus>Try again</button>
  </main>
  <script>
    const to = new URLSearchParams(location.search).get('to');
    document.getElementById('retry').onclick = () => { if (/^https?:/.test(to || '')) location.href = to; else history.back(); };
  </script>
</body>
</html>
