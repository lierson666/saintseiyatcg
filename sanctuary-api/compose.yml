# sanctuary-api no mamaco-dev: projeto próprio ("-p sanctuary"), na rede do Caddy do casamamaco.
# Subir (root): docker compose -f /home/dev/sanctuary-api/compose.yml -p sanctuary up -d --build
services:
  sanctuary-api:
    build: .
    restart: unless-stopped
    environment:
      SANCTUARY_ORIGIN: https://saintseiyatcg.com
      SANCTUARY_INVITES: ${SANCTUARY_INVITES:-}
      SANCTUARY_ADMINS: ${SANCTUARY_ADMINS:-}
      ARENA_URL: http://arena-server:8090
      ARENA_SECRET: ${ARENA_SECRET:-}
      SANCTUARY_ENV: playtest
      COSMO_REGISTRY: /app/registry
      # Identity & Payment Forge (11/11/2026): segredos e chaves vêm do .env do dev; tudo desligado por padrão.
      SANCTUARY_PUBLIC_URL: https://saintseiyatcg.com
      SANCTUARY_PII_KEY: ${SANCTUARY_PII_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      SANCTUARY_PAYMENTS_ENV: ${SANCTUARY_PAYMENTS_ENV:-sandbox}
      SANCTUARY_AGE_GATE_REQUIRED: ${SANCTUARY_AGE_GATE_REQUIRED:-0}
      SANCTUARY_IDENTITY_VERIFICATION_ENABLED: ${SANCTUARY_IDENTITY_VERIFICATION_ENABLED:-0}
      SANCTUARY_PAYMENTS_ENABLED: ${SANCTUARY_PAYMENTS_ENABLED:-0}
      SANCTUARY_MERCADO_PAGO_ENABLED: ${SANCTUARY_MERCADO_PAGO_ENABLED:-0}
      SANCTUARY_GOOGLE_PLAY_BILLING_ENABLED: ${SANCTUARY_GOOGLE_PLAY_BILLING_ENABLED:-0}
      SANCTUARY_RANDOM_BOOSTERS_PURCHASABLE: ${SANCTUARY_RANDOM_BOOSTERS_PURCHASABLE:-0}
    volumes:
      - sanctuary-data:/data
      - /home/dev/saintseiyatcg/data/registry:/app/registry:ro
    networks: [casamamaco_default]
volumes:
  sanctuary-data:
networks:
  casamamaco_default:
    external: true
